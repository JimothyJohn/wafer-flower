name: CI

# This repo is a CAD/art project: loose Python generator scripts with no
# packaged dependency manifest. CI runs a cheap syntax pass over everything
# (including scripts/legacy — archived but kept compiling), then THE
# pipeline: scripts/mine_stl.py, the parametric generator for Nick's
# canonical architecture (stl/mine/). It self-verifies with boolean gates
# (gear mesh sweep, lap-tab pair, wafer/segment/pinion clearances) and
# compares its output against the canonical meshes, exiting nonzero on any
# FAIL. Legacy generators (segment_stl, cure_jig, bracket, coupons,
# viewer_export) were removed from CI 2026-08-14 — see scripts/legacy/.

on:
  push:
    branches: [master, dev]
  pull_request:

permissions: {}

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Byte-compile Python scripts (incl. legacy)
        run: python3 -m compileall -q scripts

  cad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install manifold3d + numpy
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --quiet manifold3d numpy
      - name: The pipeline — mine_stl.py (self-gating, exit nonzero on FAIL)
        run: .ci-venv/bin/python scripts/mine_stl.py -o /tmp/stl-ci
