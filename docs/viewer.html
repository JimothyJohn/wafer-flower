<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wafer Halo — CAD viewer (real STLs)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=20260816b">
</head>
<body>
<div class="page wide">

<nav class="topnav">
  <a href="index.html">Overview</a>
  <a href="design.html">Design</a>
  <a href="engineering.html">Engineering</a>
  <a href="production.html">Production</a>
  <span class="sep">·</span>
  <a href="customize.html">Customize</a>
  <a class="here" href="viewer.html">CAD viewer</a>
  <a href="spec-sheet.html">Spec sheet</a>
</nav>

<header style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 14px">
  <div>
    <div class="eyebrow">The real parts</div>
    <h1 style="font-size:26px">Wafer Halo · CAD viewer</h1>
    <p style="margin:6px 0 0;max-width:70ch">Orbit it. Break it apart.
    Then <a href="customize.html">make your own</a>.</p>
  </div>
</header>

<div class="viewer">
  <div class="wrap">
    <div>
      <canvas id="viz"></canvas>
      <div id="status">loading models…</div>
    </div>
    <div class="panel">
      <div class="card">
        <div class="presets" id="presets">
          <button class="pz act" data-p="one">One</button>
          <button class="pz" data-p="pair">Pair</button>
          <button class="pz" data-p="halo">Halo</button>
          <button class="pz" data-p="drive">Drive</button>
          <button class="pz" data-p="boom">Break it apart</button>
        </div>
      </div>
      <div class="card">
        <div class="row"><label>Break apart</label>
          <input type="range" id="boom" min="0" max="1" step="0.001" value="0">
          <span class="val" id="boomv">whole</span></div>
        <div class="row"><label>Wafer drop</label>
          <input type="range" id="lift" min="0" max="1" step="0.001" value="0">
          <span class="val" id="liftv">bonded</span></div>
        <div class="row"><label>Ring</label>
          <input type="range" id="stations" min="1" max="9" step="1" value="1">
          <span class="val" id="stationsv">1</span></div>
        <div class="row"><label>Cut</label>
          <input type="range" id="section" min="0" max="1" step="0.001" value="1">
          <span class="val" id="sectionv">off</span></div>
        <div class="row"><label>Wafers</label>
          <input type="checkbox" id="waf" checked><span class="val" id="wafv">on</span></div>
        <div class="row"><label>Pinion</label>
          <input type="checkbox" id="drv"><span class="val" id="drvv">off</span></div>
        <div class="row"><label>Twin</label>
          <input type="checkbox" id="param"><span class="val" id="paramv">off</span></div>
        <div class="note">Drag to orbit · scroll to zoom. Twin = the
          code-generated copy of the hand-built part.</div>
      </div>
    </div>
  </div>
</div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/viewer.js?v=20260816b"></script>
</body>
</html>
